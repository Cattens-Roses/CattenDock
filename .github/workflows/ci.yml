name: Build & Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true
        default: '0.2.0'
      publish:
        description: 'Publish a GitHub Release? (otherwise artifact only)'
        type: boolean
        default: false

permissions:
  contents: write   # required to create releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-dev \
            nodejs npm dpkg-dev build-essential git ca-certificates

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building CattenDock $VERSION"

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-deb.sh

      - name: Generate checksums
        run: |
          cd build
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cattendock-deb
          path: |
            build/*.deb
            build/SHA256SUMS
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cattendock-deb
          path: dist

      - name: Show contents
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: CattenDock ${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/SHA256SUMS
          body: |
            ## CattenDock ${{ needs.build.outputs.version }}

            ### Install on Debian 12

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}/cattendock_${{ needs.build.outputs.version }}_amd64.deb
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}/SHA256SUMS
            sha256sum -c SHA256SUMS --ignore-missing
            sudo apt install ./cattendock_${{ needs.build.outputs.version }}_amd64.deb
